name: Build APK

on:
  push:
    branches:
      - mammut
      - feat/phase1-port
      - build/ci-setup
  pull_request:
    branches:
      - mammut
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to assemble
        type: choice
        default: githubRelease
        options:
          - githubRelease
          - debug

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes "tools", which no longer
          # exists in the SDK repository. Install what we need explicitly below.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Secrets are not exposed to pull requests from forks, so only sign on push/dispatch.
      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p mastodon/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > mastodon/keystore/ci-release.jks
          keytool -list -keystore mastodon/keystore/ci-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | head -20

      - name: Assemble
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: key0
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          VARIANT="${VARIANT:-githubRelease}"
          if [ "$VARIANT" = "debug" ]; then TASK=":mastodon:assembleDebug"; else TASK=":mastodon:assembleGithubRelease"; fi
          echo "Building $TASK"
          ./gradlew "$TASK" --console=plain --stacktrace

      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=$(find mastodon/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          APKSIGNER=$(command -v apksigner || echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner")
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mammut-${{ github.event.inputs.variant || 'githubRelease' }}-${{ github.sha }}
          path: |
            mastodon/build/outputs/apk/**/*.apk
            mastodon/build/outputs/apk/**/*.sha256
          if-no-files-found: error
          retention-days: 30
