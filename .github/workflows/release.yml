name: Release

# Tag-driven releases. Push v1.0.0 and this builds the signed APK, verifies the
# signature, and publishes a GitHub release with the APK and its checksum.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # The mapsplatform secrets plugin requires local.properties to exist.
      - name: Create empty local.properties
        run: touch local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew :mastodon:testDebugUnitTest --console=plain

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 is not set: a release cannot be signed." >&2
            exit 1
          fi
          mkdir -p mastodon/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > mastodon/keystore/ci-release.jks
          keytool -list -keystore mastodon/keystore/ci-release.jks \
            -storepass:env KEYSTORE_PASSWORD | head -20

      - name: Assemble signed release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: key0
        run: ./gradlew :mastodon:assembleGithubRelease --console=plain --stacktrace

      - name: Verify signature and checksum
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing unexpected release tag format: $RELEASE_TAG" >&2
            exit 1
          fi
          APK=$(find mastodon/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          APKSIGNER=$(command -v apksigner || echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner")
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "mammut-${RELEASE_TAG#v}.apk"
          sha256sum "mammut-${RELEASE_TAG#v}.apk" | tee "mammut-${RELEASE_TAG#v}.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing unexpected release tag format: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "mammut-${RELEASE_TAG#v}.apk" "mammut-${RELEASE_TAG#v}.apk.sha256" \
            --repo "$REPO" \
            --title "Mammut ${RELEASE_TAG#v}" \
            --generate-notes \
            --latest
