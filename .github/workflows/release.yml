name: Release

# Tag-driven releases. Push v1.0.0 and this builds the signed APK, verifies the
# signature, and publishes a GitHub release with the APK and its checksum.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The mapsplatform secrets plugin requires local.properties to exist.
      - name: Create empty local.properties
        run: touch local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 is not set: a release cannot be signed." >&2
            exit 1
          fi
          mkdir -p mastodon/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > mastodon/keystore/ci-release.jks
          keytool -list -keystore mastodon/keystore/ci-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | head -20

      - name: Assemble signed release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: key0
        run: ./gradlew :mastodon:assembleGithubRelease --console=plain --stacktrace

      - name: Verify signature and checksum
        run: |
          set -euo pipefail
          APK=$(find mastodon/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          APKSIGNER=$(command -v apksigner || echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner")
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" mammut-${GITHUB_REF_NAME#v}.apk
          sha256sum "mammut-${GITHUB_REF_NAME#v}.apk" | tee mammut-${GITHUB_REF_NAME#v}.apk.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            "mammut-${TAG#v}.apk" "mammut-${TAG#v}.apk.sha256" \
            --repo "${{ github.repository }}" \
            --title "Mammut ${TAG#v}" \
            --generate-notes \
            --latest
